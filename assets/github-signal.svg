    <style><![CDATA[
      .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .sweep { animation: sweep 4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.75) } 50% { opacity: 1; transform: scale(1.35) } }
      @keyframes sweep { 0%,100% { opacity: .04; transform: translateX(0) } 50% { opacity: .32; transform: translateX(720px) } }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
    ]]></style>
  </defs>
