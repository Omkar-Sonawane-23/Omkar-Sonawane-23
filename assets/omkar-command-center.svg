<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">OMKAR SONAWANE — cyberpunk engineering command center</title>
  <desc id="desc">A neon animated command center showing software engineering, security, open source, and active projects.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/><stop offset=".55" stop-color="#0b1028"/><stop offset="1" stop-color="#150b2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00f5d4"/><stop offset=".5" stop-color="#00bbf9"/><stop offset="1" stop-color="#f15bb5"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f15bb5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#00bbf9" stop-opacity=".36"/><stop offset="1" stop-color="#00bbf9" stop-opacity="0"/></radialGradient>
    <radialGradient id="aura2"><stop stop-color="#f15bb5" stop-opacity=".27"/><stop offset="1" stop-color="#f15bb5" stop-opacity="0"/></radialGradient>
    <pattern id="microgrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7dd3fc" stroke-opacity=".07"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSmall" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="screenClip"><rect x="36" y="78" width="1328" height="370" rx="18"/></clipPath>
    <style><![CDATA[
      .spin { transform-origin: 700px 248px; animation: spin 19s linear infinite; }
      .spinReverse { transform-origin: 700px 248px; animation: spin 27s linear infinite reverse; }
      .scan { animation: scan 4s ease-in-out infinite; }
      .scan2 { animation: scan2 6s ease-in-out infinite; }
      .dash { stroke-dasharray: 7 14; animation: dash 10s linear infinite; }
      .dashFast { stroke-dasharray: 3 10; animation: dash 4s linear infinite; }
      .flicker { animation: flicker 2.8s steps(2, jump-none) infinite; }
      .flicker2 { animation: flicker 3.6s steps(2, jump-none) .7s infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse2 { animation: pulse 2s ease-in-out .8s infinite; transform-box: fill-box; transform-origin: center; }
      .float { animation: float 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .float2 { animation: float 7s ease-in-out 1s infinite reverse; transform-box: fill-box; transform-origin: center; }
      .glitch { animation: glitch 4.5s steps(2, jump-none) infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
      @keyframes dash { to { stroke-dashoffset: -180 } }
      @keyframes scan { 0%,100% { transform: translateY(0); opacity: .06 } 50% { transform: translateY(245px); opacity: .38 } }
      @keyframes scan2 { 0%,100% { transform: translateX(0); opacity: .08 } 50% { transform: translateX(610px); opacity: .28 } }
      @keyframes flicker { 0%,88%,92%,100% { opacity: 1 } 89%,91% { opacity: .22 } }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.78) } 50% { opacity: 1; transform: scale(1.25) } }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
      @keyframes glitch { 0%,87%,100% { transform: translate(0,0) } 88% { transform: translate(3px,-1px) } 90% { transform: translate(-2px,1px) } }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
    ]]></style>
  </defs>

  <rect width="1400" height="520" rx="30" fill="url(#space)"/>
  <rect x="36" y="78" width="1328" height="370" rx="18" fill="url(#microgrid)" stroke="#25345f" stroke-width="2"/>
  <circle cx="250" cy="110" r="280" fill="url(#aura)"/>
  <circle cx="1160" cy="350" r="320" fill="url(#aura2)"/>

  <!-- top HUD -->
  <text x="52" y="46" fill="#00f5d4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3">OMKAR.SONAWANE // ENGINEERING COMMAND CENTER</text>
  <text x="1348" y="46" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">SYS.ID: WEB403-23</text>
  <circle class="pulse" cx="1330" cy="40" r="4" fill="#a7f3d0" filter="url(#glowSmall)"/>

  <!-- background circuitry -->
  <g fill="none" stroke-linecap="round" opacity=".6">
    <path class="dash" d="M72 115 H260 V170 H344" stroke="#00f5d4" stroke-width="1.5"/>
    <path class="dashFast" d="M1328 140 H1208 V198 H1094" stroke="#f15bb5" stroke-width="1.5"/>
    <path class="dash" d="M78 406 H220 V350 H300" stroke="#7c3aed" stroke-width="1.5"/>
    <path class="dashFast" d="M1320 390 H1212 V335 H1130" stroke="#00bbf9" stroke-width="1.5"/>
  </g>
  <g class="pulse2" fill="#00f5d4"><circle cx="260" cy="170" r="4" filter="url(#glowSmall)"/><circle cx="1208" cy="198" r="4" filter="url(#glowSmall)"/></g>
  <g class="pulse" fill="#f15bb5"><circle cx="220" cy="350" r="4" filter="url(#glowSmall)"/><circle cx="1212" cy="335" r="4" filter="url(#glowSmall)"/></g>

  <!-- left module panel -->
  <g transform="translate(68 116)">
    <rect width="300" height="250" rx="12" fill="#081226" fill-opacity=".88" stroke="#234064"/>
    <text x="20" y="30" fill="#00f5d4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">ACTIVE MODULES</text>
    <path d="M20 45H280" stroke="#25345f"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <text x="20" y="82" fill="#f8fafc">01  FULL_STACK</text><text x="245" y="82" fill="#a7f3d0">ONLINE</text>
      <text x="20" y="122" fill="#f8fafc">02  SECURITY</text><text x="245" y="122" fill="#a7f3d0">ACTIVE</text>
      <text x="20" y="162" fill="#f8fafc">03  OPEN_SOURCE</text><text x="245" y="162" fill="#fcd34d">SYNC</text>
      <text x="20" y="202" fill="#f8fafc">04  DEVELOPER_XP</text><text x="245" y="202" fill="#67e8f9">BUILD</text>
    </g>
    <g fill="#00f5d4" opacity=".72"><rect x="20" y="94" width="230" height="3" rx="2"/><rect x="20" y="134" width="190" height="3" rx="2"/><rect x="20" y="174" width="214" height="3" rx="2"/><rect x="20" y="214" width="168" height="3" rx="2"/></g>
    <rect class="scan" x="16" y="55" width="268" height="2" fill="#00f5d4"/>
  </g>

  <!-- center holographic core -->
  <g class="float">
    <circle cx="700" cy="250" r="126" fill="url(#aura)" opacity=".4"/>
    <circle class="spin" cx="700" cy="250" r="112" fill="none" stroke="url(#neon)" stroke-width="2" stroke-dasharray="2 12"/>
    <ellipse class="spinReverse" cx="700" cy="250" rx="150" ry="57" fill="none" stroke="#f15bb5" stroke-opacity=".8" stroke-width="2"/>
    <ellipse class="spin" cx="700" cy="250" rx="155" ry="64" fill="none" stroke="#00f5d4" stroke-opacity=".5" stroke-width="1.5" transform="rotate(58 700 250)"/>
    <path d="M700 136 L796 191 V300 C796 363 747 404 700 423 C653 404 604 363 604 300 V191 Z" fill="#101e41" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>
    <path d="M700 173 L759 207 V295 C759 334 730 359 700 374 C670 359 641 334 641 295 V207 Z" fill="#07111f" stroke="#00bbf9" stroke-opacity=".45"/>
    <path d="M664 272 l27 27 52-64" fill="none" stroke="#a7f3d0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="glitch" x="700" y="462" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="7">BUILD // SECURE // SHIP</text>
    <text x="700" y="486" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">FULL-STACK ENGINEERING  ·  OPEN SOURCE  ·  CYBERSECURITY</text>
  </g>

  <!-- right mission panel -->
  <g transform="translate(1032 116)">
    <rect width="300" height="250" rx="12" fill="#110d23" fill-opacity=".9" stroke="#4c2a68"/>
    <text x="20" y="30" fill="#f15bb5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">MISSION LOG</text>
    <path d="M20 45H280" stroke="#4c2a68"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="20" y="79" fill="#c4b5fd" font-size="12">[01] ROUTEMAP</text><text x="20" y="98" fill="#94a3b8" font-size="11">static analysis / express</text><circle class="pulse" cx="264" cy="88" r="6" fill="#00f5d4"/>
      <text x="20" y="139" fill="#c4b5fd" font-size="12">[02] CODEGLIMPSE+</text><text x="20" y="158" fill="#94a3b8" font-size="11">realtime collaboration</text><circle class="pulse2" cx="264" cy="148" r="6" fill="#fcd34d"/>
      <text x="20" y="199" fill="#c4b5fd" font-size="12">[03] VEDICVANI</text><text x="20" y="218" fill="#94a3b8" font-size="11">full-stack content platform</text><circle class="pulse" cx="264" cy="208" r="6" fill="#a7f3d0"/>
    </g>
    <path class="dashFast" d="M20 232H280" stroke="#f15bb5" stroke-width="1"/>
    <text class="flicker" x="20" y="242" fill="#f15bb5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1">NEXT_SIGNAL: SHIP_IT</text>
  </g>

  <!-- animated radar sweep -->
  <path class="scan2" d="M438 90 V408" stroke="#00f5d4" stroke-opacity=".18" stroke-width="2"/>
  <path class="scan2" d="M964 90 V408" stroke="#f15bb5" stroke-opacity=".16" stroke-width="2"/>
</svg>