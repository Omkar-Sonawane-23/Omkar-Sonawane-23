<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Mission control: build, secure, open source, learn</title>
  <desc id="desc">A neon radar display with a rotating sweep and four engineering priorities.</desc>
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#18102f"/></linearGradient>
    <linearGradient id="mRing"><stop stop-color="#00f5d4"/><stop offset="1" stop-color="#f15bb5"/></linearGradient>
    <filter id="mGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style><![CDATA[
      .radar { transform-origin: 550px 150px; animation: radar 8s linear infinite; }
      .blink { animation: blink 1.7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink2 { animation: blink 1.7s ease-in-out .6s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes radar { to { transform: rotate(360deg) } }
      @keyframes blink { 0%,100% { opacity: .35; transform: scale(.8) } 50% { opacity: 1; transform: scale(1.3) } }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
    ]]></style>
  </defs>
  <rect width="1100" height="300" rx="24" fill="url(#mBg)"/>
  <circle cx="550" cy="150" r="110" fill="none" stroke="#334155" stroke-dasharray="3 8"/>
  <circle cx="550" cy="150" r="74" fill="none" stroke="url(#mRing)" stroke-opacity=".55"/>
  <circle cx="550" cy="150" r="38" fill="#0b1024" stroke="#00f5d4" stroke-width="2" filter="url(#mGlow)"/>
  <text x="550" y="146" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800">FOCUS</text>
  <text x="550" y="165" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">ONLINE</text>
  <g class="radar" fill="none"><path d="M550 150 L550 34 A116 116 0 0 1 632 68 Z" fill="#00f5d4" fill-opacity=".13" stroke="#00f5d4" stroke-opacity=".7"/></g>
  <g font-family="ui-monospace, monospace" font-size="13" font-weight="700">
    <circle class="blink" cx="550" cy="40" r="7" fill="#00f5d4" filter="url(#mGlow)"/><text x="550" y="22" text-anchor="middle" fill="#a7f3d0">BUILD</text>
    <circle class="blink2" cx="660" cy="150" r="7" fill="#f15bb5" filter="url(#mGlow)"/><text x="690" y="155" fill="#fbcfe8">SECURE</text>
    <circle class="blink" cx="550" cy="260" r="7" fill="#fcd34d" filter="url(#mGlow)"/><text x="550" y="286" text-anchor="middle" fill="#fef3c7">OPEN SOURCE</text>
    <circle class="blink2" cx="440" cy="150" r="7" fill="#67e8f9" filter="url(#mGlow)"/><text x="410" y="155" text-anchor="end" fill="#cffafe">LEARN</text>
  </g>
  <path d="M110 150 H400 M700 150 H990" stroke="#334155" stroke-dasharray="5 14"/>
  <text x="55" y="72" fill="#64748b" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">MISSION CONTROL / 2026</text>
  <text x="1045" y="240" text-anchor="end" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">SIGNAL: STRONG</text>
</svg>